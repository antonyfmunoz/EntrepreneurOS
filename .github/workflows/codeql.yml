name: CodeQL

on:
  pull_request:
  push:
    branches: [feature/company-system, main]
  schedule:
    - cron: "23 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eos-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:javascript-typescript"
          output: ../codeql-results
      - name: Reject reportable CodeQL findings
        env:
          SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises";
          import { join } from "node:path";

          const directory = process.env.SARIF_DIRECTORY;
          if (!directory) throw new Error("CodeQL did not return a SARIF directory.");
          const files = (await readdir(directory)).filter((file) => file.endsWith(".sarif"));
          if (files.length === 0) throw new Error("CodeQL did not produce a SARIF result.");
          const acceptedReviewedProtocolCryptography = (result) => {
            const uri = result.locations?.[0]?.physicalLocation?.artifactLocation?.uri || "";
            const reviewedProtocolImplementations = new Map([
              ["server/integrations/gmail.ts", "HMAC-SHA256 OAuth state integrity"],
              ["server/integrations/notion.ts", "HMAC-SHA256 OAuth state integrity"],
              ["server/integrations/recovery-commercial.ts", "RS256 DocuSign JWT client assertion"],
            ]);
            return result.ruleId === "js/insufficient-password-hash"
              && [...reviewedProtocolImplementations.keys()].some((path) => uri.endsWith(path));
          };
          let findings = 0;
          let accepted = 0;
          for (const file of files) {
            const sarif = JSON.parse(await readFile(join(directory, file), "utf8"));
            for (const run of sarif.runs || []) {
              for (const result of run.results || []) {
              if (acceptedReviewedProtocolCryptography(result)) accepted += 1;
              else {
                findings += 1;
                const uri = result.locations?.[0]?.physicalLocation?.artifactLocation?.uri || "unknown";
                const line = result.locations?.[0]?.physicalLocation?.region?.startLine || "unknown";
                console.error(`::error file=${uri},line=${line},title=CodeQL ${result.ruleId || "finding"}::Review this static-analysis result before merge.`);
              }
              }
            }
          }
          if (accepted > 3) throw new Error(`Expected at most three reviewed protocol-cryptography exceptions, found ${accepted}.`);
          if (findings > 0) {
            console.error(`::error title=CodeQL findings::CodeQL reported ${findings} finding(s). Review and remediate them before merge.`);
            process.exit(1);
          }
          console.log(`CodeQL reported zero unreviewed findings; accepted ${accepted} reviewed protocol-cryptography false positive(s).`);
          NODE
