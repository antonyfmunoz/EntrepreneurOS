name: CodeQL

on:
  pull_request:
  push:
    branches: [feature/company-system, main]
  schedule:
    - cron: "23 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eos-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:javascript-typescript"
          output: ../codeql-results
      - name: Reject reportable CodeQL findings
        env:
          SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises";
          import { join } from "node:path";

          const directory = process.env.SARIF_DIRECTORY;
          if (!directory) throw new Error("CodeQL did not return a SARIF directory.");
          const files = (await readdir(directory)).filter((file) => file.endsWith(".sarif"));
          if (files.length === 0) throw new Error("CodeQL did not produce a SARIF result.");
          let findings = 0;
          for (const file of files) {
            const sarif = JSON.parse(await readFile(join(directory, file), "utf8"));
            for (const run of sarif.runs || []) findings += (run.results || []).length;
          }
          if (findings > 0) {
            console.error(`::error title=CodeQL findings::CodeQL reported ${findings} finding(s). Review and remediate them before merge.`);
            process.exit(1);
          }
          console.log("CodeQL reported zero findings.");
          NODE
