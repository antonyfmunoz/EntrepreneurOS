<body class="bg-surface text-on-surface antialiased overflow-hidden">
<main class="flex min-h-screen w-full">
<!-- Left Side: Login Form (40%) -->
<section class="w-[40%] min-w-[400px] bg-surface-container-low flex flex-col px-12 py-16 relative z-10 shadow-[20px_0_60px_rgba(0,0,0,0.02)]">

<div class="flex items-center gap-2 mb-24">
<span class="material-symbols-outlined text-[28px]" style="color: #2c2f30;">smart_toy</span>
<span class="text-[20px] font-bold tracking-tighter" style="color: #2c2f30;">EntrepreneurOS</span>
</div>
<!-- Login Content -->
<div class="max-w-[340px]">
<h1 class="text-[28px] font-semibold tracking-[-0.02em] leading-tight mb-2 text-on-surface">Welcome back</h1>
<p class="text-[15px] text-[#525252] mb-10">Access your workspace</p>
<form class="space-y-6">
<!-- Email Input -->
<div class="relative group purple-glow rounded-xl">
<input class="peer w-full bg-[#f5f6f7] ghost-border border-none rounded-xl px-4 pt-6 pb-2 text-on-surface focus:ring-0 transition-all duration-300" id="email" name="email" placeholder=" " type="email"/>
<label class="absolute left-4 top-4 text-slate-400 text-sm transition-all duration-300 pointer-events-none peer-focus:text-xs peer-focus:top-2 peer-focus:text-primary peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:top-2" for="email">
                            Email Address
                        </label>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="relative group purple-glow rounded-xl">
<input class="peer w-full bg-[#f5f6f7] ghost-border border-none rounded-xl px-4 pt-6 pb-2 text-on-surface focus:ring-0 transition-all duration-300" id="password" name="password" placeholder=" " type="password"/>
<label class="absolute left-4 top-4 text-slate-400 text-sm transition-all duration-300 pointer-events-none peer-focus:text-xs peer-focus:top-2 peer-focus:text-primary peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:top-2" for="password">
                                Password
                            </label>
</div>
<div class="flex justify-end">
<a class="text-xs font-medium text-primary hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full h-14 bg-gradient-to-br from-[#6a37d4] to-[#ae8dff] text-white font-semibold rounded-[12px] shadow-[0_8px_32px_rgba(106,55,212,0.2)] hover:scale-[1.01] active:scale-[0.98] transition-all" type="submit">
                        Sign In
                    </button>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-outline-variant opacity-20"></div>
<span class="text-[12px] font-bold text-slate-400 uppercase tracking-widest">OR</span>
<div class="h-[1px] flex-1 bg-outline-variant opacity-20"></div>
</div>
<!-- SSO -->
<button class="w-full h-14 bg-white ghost-border rounded-xl flex items-center justify-center gap-3 text-on-surface font-medium hover:bg-slate-50 transition-colors shadow-sm" type="button">
<img alt="Google Logo" class="w-5 h-5" data-alt="Official Google multicolor G icon on a transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQ0wu7hszmRjfY46gCCozr0J_xVxtLV9GCIFBMc5veLtUfb9wYb9txO-nVJu5YODYePKWIrquxFiUTFxqP_wfYc2nE2b34w66yLmcwf51ibID3yF2rDtoDrLBb_IgBtX4pK927LPI36RGOGlr3vd5eECjeuqXdtb2QIX37bVMVcWu9siOri_UzQeVG_HbI5PoohrHAJXlX-MP4LljNoCcjb7go8DRO7f1G4vGUKH8tKc4-MMgD0x2C4hJQgxPbqtDoKTGfufHRuRXd"/>
                        Continue with Google
                    </button>
</form>
<!-- Footer Link -->
<div class="mt-12">
<a class="text-[14px] font-medium text-on-surface-variant flex items-center gap-1 group" href="#">
                        Don't have an account? <span class="text-primary group-hover:underline">Create one →</span>
</a>
</div>
</div>
<!-- Footer Small -->
<div class="mt-auto pt-8">
<p class="text-[11px] text-slate-400 tracking-wider uppercase font-semibold">© 2024 EntrepreneurOS</p>
</div>
</section>
<!-- Right Side: Editorial Space (60%) -->
<section class="w-[60%] bg-white flex items-center justify-center p-16 relative overflow-hidden">
<!-- Abstract Architectural Background Elements -->
<div class="absolute inset-0 opacity-40 pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[80%] h-[80%] rounded-full bg-primary-container/10 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[60%] h-[60%] rounded-full bg-secondary-container/10 blur-[100px]"></div>
</div>
<!-- Image/Visual Canvas -->
<div class="relative w-full max-w-2xl h-full flex items-center justify-center">
<div class="w-full aspect-[4/5] rounded-[2rem] overflow-hidden shadow-[0_32px_80px_rgba(106,55,212,0.12)] bg-surface-container-low relative">
<img alt="Architectural Abstract" class="w-full h-full object-cover grayscale brightness-110" data-alt="Sophisticated monochrome architectural sketch of a futuristic minimalist building with sharp lines and clean geometric shapes under soft light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCoqHNc5HcJmLmbjElxxDd43wyQZBDAhNWNxxPsI_PQPxHy8yxbJono7mSduOKKSAlKpRZVg2_o9zo3y0i5ZQVFo3rLBvj64CUqz_O9BCBJo_27gwo1Ax7S4xjYc9b2EaG1-uUhBnSXU4jpwnJfFds9Lj0z9CP6tOUj3WZymOtM0Ad_zUJ2t8lBBawICfwpRMb0tgHBdzoeZ4YC9F5QkOp78DdLEMrFQZZIqWpnOSt2QF6KuLcS08BI91xL9df9EzRq_93IrkP0QM0U"/>
<!-- Glassmorphism Card Overlay -->
<div class="absolute inset-x-8 bottom-8 glass-panel p-10 rounded-2xl shadow-[0_8px_32px_rgba(106,55,212,0.08)]">
<div class="mb-6">
<span class="material-symbols-outlined text-primary text-[40px] leading-none" style="font-variation-settings: 'FILL' 1;">format_quote</span>
</div>
<h2 class="text-[32px] font-semibold leading-[1.1] tracking-[-0.03em] text-on-surface mb-6">

<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed overflow-hidden">

<div class="w-24 h-[2px] bg-primary"></div>
</div>
</section>
