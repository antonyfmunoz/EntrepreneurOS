<style>
        body { font-family: 'Inter', sans-serif; }
        .lucid-gradient { background: linear-gradient(135deg, #6a37d4 0%, #ae8dff 100%); }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); }

        .ghost-border { border: 1px solid rgba(123, 116, 134, 0.1); }

<body class="bg-[#f5f6f7] min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Abstract Architectural Background Elements -->
<div class="absolute inset-0 pointer-events-none">
<!-- Vertical Ghost Line -->
<div class="absolute left-[15%] top-0 bottom-0 w-px ghost-border"></div>
<!-- Horizontal Floating Block -->
<div class="absolute left-[5%] top-[20%] w-64 h-64 ghost-border opacity-50 rounded-full"></div>
<!-- Geometric Grid Segment -->
<div class="absolute left-[10%] bottom-[10%] w-96 h-48 ghost-border rounded-xl"></div>
<!-- Faint Brand Glow -->
<div class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] rounded-full bg-primary/5 blur-[120px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-5xl px-8 flex flex-col md:flex-row items-center justify-between gap-16">
<!-- Editorial Left Side -->
<div class="w-full md:w-1/2 flex flex-col items-start text-left space-y-4">
<div class="space-y-1">
<p class="text-[0.75rem] font-bold tracking-[0.2em] text-primary uppercase">STRATEGIC ACCESS TERMINAL</p>
<h1 class="text-[3.5rem] font-semibold tracking-[-0.02em] leading-none text-on-background">Welcome back.</h1>
</div>
<p class="text-on-surface-variant max-w-sm text-lg leading-relaxed">
                Enter the Architect’s environment to manage your digital ecosystem and strategic operations.
            </p>
</div>
<!-- Auth Card -->
<div class="w-full md:w-[460px] glass-panel tinted-shadow p-12 rounded-[24px]">
<form class="space-y-8" onsubmit="return false;">
<div class="space-y-4">
<!-- Email Field -->
<div class="group">
<label class="block text-[0.75rem] font-semibold text-on-surface/60 mb-2 ml-1">IDENTIFIER</label>
<input class="w-full bg-surface-container-highest border-0 rounded-[12px] px-6 py-4 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-300 placeholder:text-on-surface-variant/40" placeholder="email@example.com" type="email"/>
</div>
<!-- Password Field -->
<div class="group">
<div class="flex justify-between items-center mb-2 ml-1">
<label class="block text-[0.75rem] font-semibold text-on-surface/60">ACCESS KEY</label>
<a class="text-[0.75rem] font-semibold text-primary-container hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-container-highest border-0 rounded-[12px] px-6 py-4 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-300 placeholder:text-on-surface-variant/40" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full lucid-gradient text-white font-semibold py-4 rounded-[12px] shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">
                    Authenticate Session
                </button>
<!-- Divider -->
<div class="relative flex items-center justify-center">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t ghost-border"></div></div>
<span class="relative px-4 text-[0.65rem] font-bold text-on-surface/40 bg-transparent uppercase tracking-widest">or continue with</span>
</div>
<!-- OAuth -->
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-lowest py-4 rounded-[12px] ghost-border hover:bg-surface-container-low transition-colors duration-200" type="button">
<img alt="" class="w-5 h-5" data-alt="Google colorful G logo icon on a white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_JXLj4ZqRwpaxOm7q_E5HwtdDxRfMYoe91mB08k1fIIzgJ0LhFsIBGHM7CdLgrOr0n4C1E9jSoOSb58fdXWPyEihf-PznicfaI5d9kfjum_DWh7vU0fnitX2ePTheG9vuH4y0AYV4-3dfC-o0ZAAtW6bCg_tA5JB8I5ZVrOY7pTmfy8EtI_wXm7TFXXYsv5thezD56tYSN6HsqrorBlzGIXdSV35QstLnrm6H8DLY471ELipQzZSh5crRhFzDkrGrUZoc-bZMBVye"/>
<span class="font-medium text-on-surface">Continue with Google</span>
</button>
<!-- Footer Link -->
<p class="text-center text-[0.875rem] text-on-surface/60">
                    Don’t have an account? 
                    <a class="font-bold text-primary-container hover:text-primary transition-colors" href="#">Create one</a>
</p>
</form>
</div>
</main>
<!-- Footer Component from JSON -->
<footer class="flex justify-between items-center px-12 py-8 w-full fixed bottom-0 left-0 bg-transparent">
<div class="hidden">EntrepreneurOS</div>
<div class="flex gap-8">
<span class="text-[0.75rem] font-normal leading-relaxed font-['Inter'] text-[#191c1d]/40 dark:text-white/40 cursor-pointer hover:text-[#5210bc] dark:hover:text-[#ae8dff] transition-colors">Privacy</span>
<span class="text-[0.75rem] font-normal leading-relaxed font-['Inter'] text-[#191c1d]/40 dark:text-white/40 cursor-pointer hover:text-[#5210bc] dark:hover:text-[#ae8dff] transition-colors">Terms</span>
<span class="text-[0.75rem] font-normal leading-relaxed font-['Inter'] text-[#191c1d]/40 dark:text-white/40 cursor-pointer hover:text-[#5210bc] dark:hover:text-[#ae8dff] transition-colors">Support</span>
</div>
<div class="text-[0.75rem] font-normal leading-relaxed font-['Inter'] text-[#191c1d]/40 dark:text-white/40">
            © 2024 EntrepreneurOS. Designed for the Lucid Architect.
        </div>
</footer>
