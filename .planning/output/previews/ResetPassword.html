<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#2e3132",
                        "surface-tint": "#6d3bd7",
                        "surface-container-low": "#f2f4f5",
                        "on-primary-fixed-variant": "#5516bf",
                        "surface-bright": "#f8f9fa",
                        "on-surface": "#191c1d",
                        "surface-container": "#eceeef",
                        "on-primary-container": "#dcccff",
                        "secondary-fixed": "#e8ddff",
                        "secondary": "#674bb5",
                        "inverse-on-surface": "#eff1f2",
                        "tertiary-container": "#6746b3",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "primary-fixed": "#e9ddff",
                        "primary-container": "#6a37d4",
                        "secondary-fixed-dim": "#cebdff",
                        "tertiary": "#4f2b9a",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#522f9d",
                        "tertiary-fixed-dim": "#d0bcff",
                        "outline-variant": "#cbc3d7",
                        "primary": "#5210bc",
                        "surface-container-highest": "#e1e3e4",
                        "surface-dim": "#d8dadb",
                        "on-secondary-fixed": "#21005e",
                        "background": "#f8f9fa",
                        "inverse-primary": "#d0bcff",
                        "on-secondary-fixed-variant": "#4f319c",
                        "tertiary-fixed": "#e9ddff",
                        "on-tertiary-fixed": "#23005c",
                        "outline": "#7b7486",
                        "surface": "#f8f9fa",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#23005c",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#494454",
                        "on-secondary-container": "#3f1e8b",
                        "surface-variant": "#e1e3e4",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#d0bcff",
                        "secondary-container": "#ab8ffe",
                        "on-tertiary-container": "#dcccff",
                        "on-background": "#191c1d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f6f7; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #6a37d4 0%, #ae8dff 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
            line-height: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center selection:bg-primary-fixed">
<header class="fixed top-0 w-full z-50 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md shadow-[0_8px_32px_rgba(106,55,212,0.08)] flex justify-between items-center px-8 h-16">
<div class="text-xl font-semibold tracking-tighter text-slate-900 dark:text-slate-50 font-headline">EntrepreneurOS</div>
<nav class="hidden md:flex gap-8 items-center">
<span class="font-['Inter'] font-medium text-sm tracking-tight text-slate-500 dark:text-slate-400 hover:text-violet-600 transition-colors duration-200 cursor-pointer">Explore</span>
<span class="font-['Inter'] font-medium text-sm tracking-tight text-slate-500 dark:text-slate-400 hover:text-violet-600 transition-colors duration-200 cursor-pointer">Support</span>
</nav>
</header>
<main class="flex-grow flex items-center justify-center w-full px-6 py-24">
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary-container/5 blur-[120px]"></div>
<div class="absolute top-[20%] -right-[5%] w-[30%] h-[30%] rounded-full bg-secondary-container/5 blur-[100px]"></div>
</div>
<div class="glass-panel w-full max-w-[480px] p-10 md:p-12 rounded-[24px] shadow-[0_8px_32px_rgba(106,55,212,0.08)] relative z-10">
<div class="mb-10 text-left">
<h1 class="text-on-surface text-[2.25rem] font-semibold leading-[1.2] mb-4 tracking-tight">Set new password.</h1>
<p class="text-on-surface-variant text-base leading-relaxed max-w-[320px]">Choose a secure password to regain access to your workspace.</p>
</div>
<form class="space-y-8">
<div class="space-y-2">
<label class="block text-[0.75rem] font-medium uppercase tracking-widest text-on-surface-variant ml-1">Password</label>
<div class="relative group">
<input class="w-full bg-surface-container-highest border-none rounded-[12px] px-4 py-4 text-on-surface placeholder:text-outline/50 focus:ring-0 transition-all" placeholder="••••••••" type="password"/>
<div class="absolute bottom-0 left-0 h-[2px] w-0 bg-primary group-focus-within:w-full transition-all duration-300"></div>
</div>
</div>
<div class="space-y-2">
<label class="block text-[0.75rem] font-medium uppercase tracking-widest text-on-surface-variant ml-1">Confirm password</label>
<div class="relative group">
<input class="w-full bg-surface-container-highest border-none rounded-[12px] px-4 py-4 text-on-surface placeholder:text-outline/50 focus:ring-0 transition-all" placeholder="••••••••" type="password"/>
<div class="absolute bottom-0 left-0 h-[2px] w-0 bg-primary group-focus-within:w-full transition-all duration-300"></div>
</div>
</div>
<div class="pt-4">
<button class="primary-gradient w-full py-4 rounded-[12px] text-on-primary font-semibold text-base shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform" type="submit">
                        Reset password
                    </button>
</div>
</form>
<div class="mt-10 flex items-center justify-start">
<a class="inline-flex items-center gap-2 text-primary font-medium hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
<span class="text-sm">Back to login</span>
</a>
</div>
</div>
</main>
<footer class="w-full py-12 bg-transparent">
<div class="flex flex-col md:flex-row justify-between items-center px-8 max-w-7xl mx-auto gap-4">
<div class="text-sm font-bold text-slate-700">EntrepreneurOS</div>
<div class="font-['Inter'] text-xs font-regular text-slate-500 dark:text-slate-400 flex flex-wrap justify-center gap-6">
<span>© 2024 EntrepreneurOS. All rights reserved.</span>
<div class="flex gap-4">
<a class="hover:text-violet-700 dark:hover:text-violet-300 transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-violet-700 dark:hover:text-violet-300 transition-colors" href="#">Terms of Service</a>
<a class="hover:text-violet-700 dark:hover:text-violet-300 transition-colors" href="#">Help Center</a>
</div>
</div>
</div>
</footer>
</body></html>
