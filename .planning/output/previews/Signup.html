<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .ethereal-gradient {
            background: linear-gradient(135deg, #6a37d4 0%, #ae8dff 100%);
        }
        .ghost-border {
            outline: 1px solid rgba(171, 173, 174, 0.1);
        }
        .tinted-shadow {
            box-shadow: 0 8px 32px rgba(106, 55, 212, 0.08);
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(106, 55, 212, 0.2);
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Shell suppressed for transactional focus, but Brand remains) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 max-w-full">
<div class="text-xl font-bold tracking-tighter text-primary">
            EntrepreneurOS
        </div>
<div class="hidden md:block">
<a class="text-slate-500 hover:text-primary transition-colors duration-300 font-medium text-sm" href="#">Help Center</a>
</div>
</header>
<main class="flex-grow flex items-center justify-center w-full px-4 pt-20 pb-12 overflow-hidden relative">
<!-- Background decorative element -->
<div class="absolute top-1/4 -left-20 w-96 h-96 bg-primary-container/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-secondary-container/5 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Central Glassmorphism Card -->
<div class="glass-card tinted-shadow rounded-[24px] w-full max-w-lg p-8 md:p-12 relative z-10">
<div class="flex flex-col items-center mb-10 text-center">
<span class="material-symbols-outlined text-primary text-4xl mb-6" data-icon="architecture" data-weight="fill" style="font-variation-settings: 'FILL' 1;">architecture</span>
<h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-on-surface mb-3">Start operating.</h1>
<p class="text-on-surface-variant text-base leading-relaxed max-w-xs">Tell us who you are and what you're building.</p>
</div>
<form class="space-y-6">
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant ml-1">Full Name</label>
<input class="w-full px-5 py-4 bg-surface-container-high rounded-xl text-on-surface placeholder:text-outline border-none ghost-border focus:ring-0 transition-all duration-300" placeholder="Jane Doe" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant ml-1">Email</label>
<input class="w-full px-5 py-4 bg-surface-container-high rounded-xl text-on-surface placeholder:text-outline border-none ghost-border focus:ring-0 transition-all duration-300" placeholder="jane@example.com" type="email"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant ml-1">Password</label>
<input class="w-full px-5 py-4 bg-surface-container-high rounded-xl text-on-surface placeholder:text-outline border-none ghost-border focus:ring-0 transition-all duration-300" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant ml-1">Company <span class="text-outline font-normal">(optional)</span></label>
<input class="w-full px-5 py-4 bg-surface-container-high rounded-xl text-on-surface placeholder:text-outline border-none ghost-border focus:ring-0 transition-all duration-300" placeholder="Acme Corp" type="text"/>
</div>
</div>
<button class="ethereal-gradient w-full py-4 text-white font-bold rounded-xl shadow-lg shadow-primary/20 hover:shadow-primary/30 active:scale-[0.98] transition-all duration-300" type="submit">
                    Create account
                </button>
</form>
<div class="mt-10 mb-8 flex items-center gap-4">
<div class="h-[1px] flex-grow bg-outline-variant opacity-30"></div>
<span class="text-[10px] font-bold tracking-widest text-outline uppercase">OR CONTINUE WITH</span>
<div class="h-[1px] flex-grow bg-outline-variant opacity-30"></div>
</div>
<div class="space-y-4">
<button class="w-full flex items-center justify-center gap-3 px-5 py-4 bg-surface-container-lowest rounded-xl text-on-surface font-semibold ghost-border hover:bg-surface-container-low transition-colors duration-300">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1.01.68-2.3 1.08-3.71 1.08-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.12c-.22-.66-.35-1.36-.35-2.12s.13-1.46.35-2.12V7.04H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.96l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.04l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
</div>
<p class="mt-10 text-center text-sm text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Log in</a>
</p>
</div>
</main>
<!-- Footer: Tonal shift background, dynamic copyright -->
<footer class="w-full py-8 flex flex-col md:flex-row items-center justify-between px-10 bg-surface-container-low/50">
<div class="text-slate-400 font-medium text-sm mb-4 md:mb-0">
            © 2024 EntrepreneurOS. Start operating.
        </div>
<div class="flex items-center gap-8">
<a class="text-slate-400 hover:text-primary transition-colors duration-300 font-medium text-sm" href="#">Privacy</a>
<a class="text-slate-400 hover:text-primary transition-colors duration-300 font-medium text-sm" href="#">Terms</a>
<a class="text-slate-400 hover:text-primary transition-colors duration-300 font-medium text-sm" href="#">Support</a>
</div>
</footer>
