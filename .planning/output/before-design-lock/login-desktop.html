<style>
        body { font-family: 'Inter', sans-serif; background-color: #0A0A0A; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        .command-input:focus { border-color: #4cd7f6; outline: none; box-shadow: 0 4px 12px -4px rgba(76, 215, 246, 0.2); }
    </style>

<body class="text-on-background min-h-screen flex flex-col justify-center items-center selection:bg-primary/30">
<!-- TopNavBar (Shared Component Placeholder - Suppressed for Login context as per rule) -->
<main class="w-full max-w-[420px] px-6 py-12">
<!-- Identity Section -->
<div class="mb-10 text-center">
<h1 class="text-2xl font-extrabold tracking-tighter text-on-surface mb-2">EntrepreneurOS</h1>
<p class="text-[11px] uppercase tracking-[0.2em] font-medium text-on-surface-variant">Your AI operating system for business</p>
</div>
<!-- Authentication Console -->
<div class="bg-[#1A1A1A] border border-white/[0.08] rounded-xl overflow-hidden shadow-2xl">
<!-- Terminal Header Detail -->
<div class="bg-surface-container-low px-4 py-2 flex items-center justify-between border-b border-white/[0.05]">
<div class="flex gap-1.5">
<div class="w-2.5 h-2.5 rounded-full bg-error/40"></div>
<div class="w-2.5 h-2.5 rounded-full bg-secondary/40"></div>
<div class="w-2.5 h-2.5 rounded-full bg-tertiary/40"></div>
</div>
<span class="text-[9px] font-mono text-on-surface-variant/50 tracking-widest">AUTH_MODULE_V1.0.4</span>
</div>
<form class="p-8 space-y-6">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block text-[10px] uppercase tracking-wider font-bold text-on-surface-variant ml-1">Account Identifier</label>
<div class="relative">
<input class="command-input w-full px-1 py-2.5 text-sm text-on-surface transition-all duration-200" placeholder="email@domain.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex justify-between items-end">
<label class="block text-[10px] uppercase tracking-wider font-bold text-on-surface-variant ml-1">Access Key</label>
</div>
<div class="relative">
<input class="command-input w-full px-1 py-2.5 text-sm text-on-surface transition-all duration-200" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Inline Error Example -->
<div class="mt-2 flex items-center gap-2 text-error animate-pulse">
<span class="material-symbols-outlined text-sm">error</span>
<span class="text-[10px] font-medium tracking-tight">System validation failed: Invalid credentials sequence.</span>
</div>
</div>
<!-- Primary Action -->
<div class="pt-2">
<button class="w-full bg-primary-container text-on-primary-container py-3 rounded-xl text-xs font-bold uppercase tracking-widest hover:opacity-90 transition-all flex items-center justify-center gap-2 group" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-sm group-hover:translate-x-0.5 transition-transform">arrow_forward_ios</span>
</button>
</div>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-white/[0.05]"></div>
<span class="flex-shrink mx-4 text-[9px] font-bold text-on-surface-variant/30 uppercase tracking-[0.3em]">Telemetry Link</span>
<div class="flex-grow border-t border-white/[0.05]"></div>
</div>
<!-- Secondary Action -->
<button class="w-full border border-outline-variant py-3 rounded-xl text-xs font-bold uppercase tracking-widest text-on-surface-variant hover:bg-white/[0.03] transition-all flex items-center justify-center gap-3" type="button">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
</form>
</div>
<!-- Utility Links -->
<div class="mt-8 flex justify-between items-center">
<a class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-sm">person_add</span>
                Create account
            </a>
<a class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant hover:text-primary transition-colors" href="#">
                Forgot password?
            </a>
</div>
</main>
<!-- Footer (Shared Component) -->
<footer class="fixed bottom-0 w-full flex justify-between px-8 py-6">
<div class="text-[10px] uppercase tracking-[0.05em] font-medium text-slate-500">© 2024 EntrepreneurOS. All rights reserved.</div>
<div class="flex gap-6">
<a class="text-[10px] uppercase tracking-[0.05em] font-medium text-slate-500 hover:text-blue-400 transition-colors" href="#">Privacy Policy</a>
<a class="text-[10px] uppercase tracking-[0.05em] font-medium text-slate-500 hover:text-blue-400 transition-colors" href="#">Terms of Service</a>
<a class="text-[10px] uppercase tracking-[0.05em] font-medium text-slate-500 hover:text-blue-400 transition-colors" href="#">Help Center</a>
</div>
</footer>
