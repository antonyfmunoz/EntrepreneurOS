<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | EntrepreneurOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary": "#ffffff",
                    "on-secondary-container": "#fffbff",
                    "on-primary-fixed-variant": "#5516be",
                    "surface-bright": "#f8f9fa",
                    "outline": "#7b7486",
                    "on-primary": "#ffffff",
                    "surface-tint": "#6d3bd7",
                    "surface-container-lowest": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface": "#f8f9fa",
                    "on-surface": "#191c1d",
                    "primary-fixed-dim": "#d0bcff",
                    "surface-variant": "#e1e3e4",
                    "inverse-surface": "#2e3132",
                    "secondary-fixed": "#eaddff",
                    "on-tertiary-fixed-variant": "#45455b",
                    "tertiary-container": "#73728b",
                    "on-background": "#191c1d",
                    "on-surface-variant": "#494454",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#e1e3e4",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#8455ef",
                    "inverse-primary": "#d0bcff",
                    "surface-container-high": "#e7e8e9",
                    "secondary-fixed-dim": "#d2bbff",
                    "on-primary-container": "#fffbff",
                    "on-secondary-fixed": "#25005a",
                    "on-tertiary-fixed": "#1a1a2e",
                    "secondary": "#712ae2",
                    "error": "#ba1a1a",
                    "on-error-container": "#93000a",
                    "tertiary": "#5a5a71",
                    "on-primary-fixed": "#23005c",
                    "surface-container": "#edeeef",
                    "surface-container-low": "#f3f4f5",
                    "on-tertiary-container": "#fffbff",
                    "primary-fixed": "#e9ddff",
                    "tertiary-fixed-dim": "#c6c4df",
                    "on-secondary-fixed-variant": "#5a00c6",
                    "outline-variant": "#cbc3d7",
                    "secondary-container": "#8a4cfc",
                    "tertiary-fixed": "#e2e0fc",
                    "primary": "#6b38d4",
                    "background": "#f8f9fa",
                    "surface-dim": "#d9dadb",
                    "inverse-on-surface": "#f0f1f2"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen flex flex-col">
<!-- Subtle Background Gradient Ornament -->
<div class="fixed top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-fixed/30 blur-[120px] rounded-full z-0"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary-fixed/20 blur-[120px] rounded-full z-0"></div>
<!-- Main Content -->
<main class="relative z-10 flex-grow flex items-center justify-center p-6 md:p-12">
<div class="w-full max-w-[420px] flex flex-col items-center">
<!-- Branding Header -->
<div class="mb-10 text-center">
<div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-primary to-primary-container rounded-xl shadow-lg mb-6 transform -rotate-6">
<span class="material-symbols-outlined text-white text-3xl" data-icon="rocket_launch">rocket_launch</span>
</div>
<h1 class="text-3xl font-black text-on-tertiary-fixed tracking-tight mb-2">EntrepreneurOS</h1>
<p class="text-on-surface-variant text-sm font-medium tracking-wide">Your AI operating system for business</p>
</div>
<!-- Auth Card -->
<div class="glass-card w-full p-8 rounded-xl shadow-[0_8px_32px_rgba(26,26,46,0.08)]">
<form aria-live="polite" class="space-y-5">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="text-[0.75rem] font-semibold text-on-tertiary-fixed-variant uppercase tracking-[0.05em] ml-1" for="email">Email</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-black/[0.05] rounded-xl text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary-fixed transition-all duration-200" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-[0.75rem] font-semibold text-on-tertiary-fixed-variant uppercase tracking-[0.05em]" for="password">Password</label>
</div>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-black/[0.05] rounded-xl text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary-fixed transition-all duration-200" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full py-3.5 mt-2 bg-gradient-to-r from-primary to-primary-container text-white font-bold rounded-xl shadow-[0_4px_12px_rgba(107,56,212,0.25)] hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">
                        Sign In
                    </button>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-black/[0.05]"></div>
<span class="flex-shrink mx-4 text-[0.75rem] font-medium text-outline-variant uppercase tracking-widest">or</span>
<div class="flex-grow border-t border-black/[0.05]"></div>
</div>
<!-- Social Login -->
<button class="w-full py-3 px-4 bg-surface-container-lowest border border-black/[0.05] rounded-xl flex items-center justify-center gap-3 text-on-tertiary-fixed font-semibold hover:bg-surface-container-low transition-colors duration-200" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Continue with Google
                    </button>
</form>
<!-- Tertiary Links -->
<div class="mt-8 flex flex-col items-center gap-3">
<a class="text-sm font-semibold text-primary hover:text-secondary transition-colors" href="/signup">Create account</a>
<a class="text-xs font-medium text-outline hover:text-on-surface-variant transition-colors" href="/forgot-password">Forgot password?</a>
</div>
<!-- Accessibility Error Anchor (Hidden) -->
<div class="hidden" id="auth-error" role="alert">
<p class="text-error text-xs text-center mt-4">The email or password you entered is incorrect.</p>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-8 flex flex-col items-center gap-4 mt-auto">
<div class="flex items-center gap-6 mb-2">
<a class="text-[0.75rem] font-medium tracking-wide uppercase text-slate-400 hover:text-violet-500 transition-colors" href="#">Privacy Policy</a>
<a class="text-[0.75rem] font-medium tracking-wide uppercase text-slate-400 hover:text-violet-500 transition-colors" href="#">Terms of Service</a>
</div>
<p class="text-[0.75rem] font-medium tracking-wide uppercase text-slate-400">© EntrepreneurOS</p>
</footer>
</body></html>
