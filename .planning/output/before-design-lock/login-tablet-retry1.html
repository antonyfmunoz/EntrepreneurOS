<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EntrepreneurOS | Tactical Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#001f26",
                        "on-tertiary-fixed-variant": "#5516be",
                        "tertiary-fixed": "#e9ddff",
                        "background": "#0A0A0A",
                        "on-tertiary-fixed": "#23005c",
                        "secondary": "#4cd7f6",
                        "surface-dim": "#131313",
                        "surface-container": "#201f1f",
                        "inverse-surface": "#e5e2e1",
                        "on-primary": "#002e6a",
                        "surface-container-lowest": "#0e0e0e",
                        "on-surface": "#e5e2e1",
                        "primary": "#3B82F6",
                        "on-secondary": "#003640",
                        "secondary-container": "#03b5d3",
                        "secondary-fixed-dim": "#4cd7f6",
                        "inverse-on-surface": "#313030",
                        "outline": "#8c909f",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#d0bcff",
                        "on-error": "#690005",
                        "on-surface-variant": "#c2c6d6",
                        "on-primary-container": "#00285d",
                        "tertiary": "#d0bcff",
                        "tertiary-container": "#a078ff",
                        "on-tertiary-container": "#340080",
                        "on-secondary-container": "#00424e",
                        "on-primary-fixed": "#001a42",
                        "on-secondary-fixed-variant": "#004e5c",
                        "inverse-primary": "#005ac2",
                        "error": "#ffb4ab",
                        "on-tertiary": "#3c0091",
                        "on-background": "#e5e2e1",
                        "secondary-fixed": "#acedff",
                        "error-container": "#93000a",
                        "surface-container-low": "#1c1b1b",
                        "surface-variant": "#353534",
                        "surface-container-high": "#2a2a2a",
                        "surface-tint": "#adc6ff",
                        "surface-container-highest": "#353534",
                        "surface-bright": "#3a3939",
                        "on-primary-fixed-variant": "#004395",
                        "primary-container": "#4d8eff",
                        "surface": "#171717",
                        "primary-fixed": "#d8e2ff",
                        "primary-fixed-dim": "#adc6ff",
                        "outline-variant": "rgba(255,255,255,0.08)"
                    },
                    "borderRadius": {
                        "DEFAULT": "6px",
                        "lg": "6px",
                        "xl": "8px",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #0A0A0A;
            color: #e5e2e1;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .auth-card {
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .input-terminal {
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            background: transparent;
            transition: border-color 150ms ease;
        }
        .input-terminal:focus {
            outline: none;
            border-bottom-color: #3B82F6;
            box-shadow: none;
        }
        .glass-glow {
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-primary/30">
<!-- Ambient background element -->
<div class="fixed inset-0 pointer-events-none glass-glow"></div>
<main class="flex-grow flex items-center justify-center p-6 relative z-10">
<div class="auth-card bg-surface w-full max-w-[420px] p-10 flex flex-col gap-8 rounded-lg">
<!-- Header Section -->
<header class="space-y-2">
<h1 class="text-3xl font-extrabold tracking-tighter text-on-surface">EntrepreneurOS</h1>
<p class="text-[0.875rem] text-on-surface-variant leading-relaxed">Your AI operating system for business</p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-6" onsubmit="return false;">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-[0.7rem] uppercase tracking-[0.15em] font-semibold text-on-surface-variant" for="email">Identity</label>
<input aria-describedby="email-error" class="input-terminal py-2 text-on-surface placeholder:text-neutral-600 font-medium" id="email" name="email" placeholder="you@company.com" type="email"/>
<div aria-live="polite" class="hidden text-error text-[0.75rem] mt-1" id="email-error">
                        Please enter a valid business email address.
                    </div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<label class="text-[0.7rem] uppercase tracking-[0.15em] font-semibold text-on-surface-variant" for="password">Access Key</label>
<button aria-label="Toggle password visibility" class="text-[0.7rem] text-primary hover:text-secondary transition-colors uppercase tracking-[0.05em] font-bold" type="button">
                            Show
                        </button>
</div>
<input aria-describedby="password-error" class="input-terminal py-2 text-on-surface placeholder:text-neutral-600" id="password" name="password" placeholder="••••••••" type="password"/>
<div aria-live="polite" class="hidden text-error text-[0.75rem] mt-1" id="password-error">
                        Invalid access key. Please try again.
                    </div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 mt-4">
<button class="bg-primary hover:brightness-110 active:scale-[0.98] text-on-primary-container font-bold py-3 px-6 transition-all duration-150 flex items-center justify-center gap-2 rounded-sm" type="submit">
<span>Sign In</span>
</button>
<div class="relative py-2 flex items-center justify-center">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant"></div></div>
<span class="relative bg-surface px-4 text-[0.65rem] uppercase tracking-[0.2em] text-neutral-500 font-bold">Protocol</span>
</div>
<button class="bg-transparent border border-outline-variant hover:bg-surface-container-high active:scale-[0.98] text-on-surface font-semibold py-3 px-6 transition-all duration-150 flex items-center justify-center gap-3 rounded-sm" type="button">
<img alt="" class="w-5 h-5" data-alt="Google G logo with corporate brand colors of blue, red, yellow, and green on white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2nYg-OKFh2FhbixSnT_MugTXaLf0kcX50cL5H_ARYk40SkXok7QJIB6eTNdKyG6nd6EVqNVkWGzf5stV8jsZ7-dvHPUMnuFBQ9I_zwMllm3t4z32U8v1L3gwBU5enmERXu-Q0VUlkAcLoKa7UnhUjXk1rCu0DqL2ixvxMyNxxuDaefs4NxSiYscIDwUdPxGt-TDeLa-e5gS16fa3u4yhGdSY4hjSv1GVviWBBv4EMiOdpZq4iYCk64xsLLssJCRaOznDVpDDkk5uf"/>
<span>Continue with Google</span>
</button>
</div>
</form>
<!-- Forgot Password Anchor -->
<div class="flex justify-center">
<a class="text-[0.75rem] text-neutral-500 hover:text-primary transition-colors font-medium" href="#">Reset operational access</a>
</div>
</div>
</main>
<!-- Shared Component: Footer -->
<footer class="fixed bottom-0 w-full flex justify-center items-center py-8 bg-transparent">
<div class="flex flex-col items-center gap-2">
<span class="font-inter text-[0.75rem] uppercase tracking-[0.1em] text-neutral-500">
                © EntrepreneurOS
            </span>
</div>
</footer>
<!-- Decorative AI Trigger (The Command Orb) -->
<div class="fixed bottom-8 right-8 z-50">
<div class="w-12 h-12 rounded-full bg-tertiary/10 backdrop-blur-xl border border-tertiary/20 flex items-center justify-center group cursor-pointer">
<div class="w-3 h-3 rounded-full bg-tertiary shadow-[0_0_15px_rgba(139,92,246,0.6)] animate-pulse"></div>
<!-- Tooltip -->
<div class="absolute right-full mr-4 bg-surface-container border border-outline-variant px-3 py-1 rounded text-[0.7rem] uppercase tracking-widest text-on-surface opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
                AI Ready
            </div>
</div>
</div>
</body></html>
