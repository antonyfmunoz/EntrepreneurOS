<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EntrepreneurOS | Secure Access</title>

                        "headline": ["Space Grotesk"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ghost-border {
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-panel {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(24px);
        }
        body {
            background-color: #0A0A0A;
        }
    </style>
</head>
<body class="font-body text-on-surface min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Decoration (Subtle Light Bleed) -->
<div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-secondary/5 blur-[100px]"></div>
</div>
<!-- Main Auth Container -->
<main class="w-full max-w-[480px] space-y-8">
<!-- Brand Identity -->
<header class="text-center space-y-2">
<h1 class="text-3xl font-headline font-bold tracking-tighter text-primary">
                EntrepreneurOS
            </h1>
<p class="text-sm font-body text-on-surface-variant font-medium tracking-tight">
                Your AI operating system for business
            </p>
</header>
<!-- Auth Card -->
<div class="glass-panel ghost-border rounded-lg p-8 shadow-2xl relative overflow-hidden">
<!-- Asymmetric accent -->
<div class="absolute top-0 left-0 w-1 h-full bg-primary/20"></div>
<form class="space-y-5" onsubmit="return false;">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="text-[11px] font-label font-bold uppercase tracking-widest text-on-surface-variant flex justify-between" for="email">
                        Email 
                        <span class="text-primary/40 font-mono">01_ID</span>
</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest ghost-border focus:border-primary focus:ring-0 rounded-md py-3 px-4 text-sm font-body placeholder:text-zinc-600 transition-all duration-200 outline-none" id="email" name="email" placeholder="you@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<label class="text-[11px] font-label font-bold uppercase tracking-widest text-on-surface-variant flex justify-between" for="password">
                        Password
                        <span class="text-primary/40 font-mono">02_KEY</span>
</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest ghost-border border-error/50 focus:border-error focus:ring-0 rounded-md py-3 px-4 text-sm font-body placeholder:text-zinc-600 transition-all duration-200 outline-none" id="password" name="password" placeholder="Enter your password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Inline Error Message -->
<div class="flex items-center gap-1.5 pt-1">
<span class="material-symbols-outlined text-[14px] text-error">error</span>
<p class="text-[12px] font-medium text-error tracking-tight">Invalid credentials sequence</p>
</div>
</div>
<!-- Primary Action -->
<div class="pt-2">
<button class="w-full bg-primary text-on-primary font-headline font-bold py-3.5 rounded-md hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/10" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]">login</span>
</button>
</div>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-white/5"></div>
<span class="flex-shrink mx-4 text-[10px] font-bold text-zinc-600 uppercase tracking-[0.2em]">OAuth Access</span>
<div class="flex-grow border-t border-white/5"></div>
</div>
<!-- Secondary Action -->
<button class="w-full ghost-border bg-transparent hover:bg-white/5 text-on-surface font-body font-medium py-3 rounded-md active:scale-[0.98] transition-all flex items-center justify-center gap-3" type="button">
<img alt="Google" class="w-5 h-5" data-alt="Official Google logo with vibrant primary colors on a transparent background for authentication branding" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCmUr-CsIDHvuzd2uhDIaPjtyzttisHA2ndWxONKUSI_UuAApputWDDmRERtGJjw288VJfY7xfrtIj48aHM40SPnFfKn1YMdxcEfK0FRY5ZTfSQSj8yxRCqIXDX95OQIySMFZW83s-aqiL6XkrP5oAIin11ZZEgjL9gbUXUsQUKHKVsegs3f44OnTaBQhIm1taC2VlzPzwGsrwLNxX8QQXthq6U8ShB987tPyKTpHtr8Yr4cqMsH-uLalbya3vhCPWToKENmjIourhp"/>
                    Continue with Google
                </button>
<!-- Footer Links -->
<div class="flex justify-between items-center pt-4 border-t border-white/5">
<a class="text-[12px] font-body text-zinc-500 hover:text-primary transition-colors" href="#">Create account</a>
<a class="text-[12px] font-body text-zinc-500 hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
</form>
</div>
<!-- System Metadata (Technical Aesthetic) -->
<div class="flex justify-between items-center px-2">
<div class="flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse shadow-[0_0_8px_rgba(76,215,246,0.6)]"></span>
<span class="text-[10px] font-mono text-zinc-600 uppercase tracking-widest">Sys_Status: Operational</span>
</div>
<span class="text-[10px] font-mono text-zinc-600 uppercase tracking-widest">v2.0.4-stable</span>
</div>
</main>
<!-- Toast Notification (Bottom Center) -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50">
<div class="bg-surface-container-highest ghost-border border-error/30 rounded-md px-4 py-2.5 flex items-center gap-3 shadow-2xl backdrop-blur-md">
<span class="material-symbols-outlined text-error text-[20px]">warning</span>
<div class="flex flex-col">
<span class="text-[12px] font-bold text-error uppercase tracking-wider">System Error</span>
<span class="text-[12px] text-zinc-400 font-medium">Connection timed out</span>
</div>
<div class="ml-4 pl-4 border-l border-white/5">
<button class="text-zinc-500 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
</div>
</div>
<!-- Background Image (Low Opacity Tech Texture) -->
<div class="fixed bottom-0 right-0 w-[400px] h-[400px] opacity-[0.03] pointer-events-none grayscale invert mix-blend-screen">
<img alt="Tech background" class="w-full h-full object-contain" data-alt="abstract technological digital wireframe structure with glowing nodes and interconnected data lines on a deep black background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAKj4sFG_tirfDNgaxBTEH0kH1lYiIdy4stMpHB_63EBTTVWQYgARkBIGqlihU3cOL_2P3hTPh3IQTnlRI8tbgjbYBaE-rRkPODszAl6whU2hQwRBaZ1jjnnmPzsak_A6qgfUYwJNp411vMfNZZuUPuyyXQem1KUR9JV06Jn2OUAamvFa8VLztNuXnGtQBOnaLRP6A300iJ9Xe9Di8wcOss0tAsyf1mYrXQyV47hAnexE5Qv2dx7mWYw2hjkLfGmxOrGdJEF836aNCM"/>
</div>
</body></html>
