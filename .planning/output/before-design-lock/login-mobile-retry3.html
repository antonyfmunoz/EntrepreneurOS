<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | EntrepreneurOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

                      "on-tertiary-fixed": "#25005a",
                      "primary-fixed-dim": "#d0bcff",
                      "tertiary-fixed-dim": "#d2bbff",
                      "inverse-on-surface": "#f2efff",
                      "surface": "#fcf8ff",
                      "on-tertiary-container": "#fffbff",

                      "surface-variant": "#e2e0fc",
                      "surface-container-low": "#f5f2ff",
                      "primary": "#6b38d4",

<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#FFFFFF] min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container">
<!-- Auth Card Container -->
<main class="w-full max-w-[400px] glass-card rounded-xl shadow-[0_8px_32px_rgba(26,26,46,0.08)] border border-on-surface/5 overflow-hidden">
<div class="p-8 space-y-8">
<!-- Brand Identity -->
<div class="flex flex-col items-center text-center space-y-3">
<div class="w-12 h-12 flex items-center justify-center rounded-xl bg-primary-container/10 text-primary">
<span class="material-symbols-outlined text-3xl" data-icon="smart_toy">smart_toy</span>
</div>
<div class="space-y-1">
<h1 class="text-2xl font-extrabold tracking-tighter text-on-surface">EntrepreneurOS</h1>
<p class="text-sm font-medium text-on-surface/60">Your AI operating system for business</p>
</div>
</div>
<!-- Auth Form -->
<form class="space-y-6" onsubmit="return false">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block text-[10px] font-bold tracking-[0.05em] uppercase text-on-surface/50 ml-1" for="email">
                        EMAIL ADDRESS
                    </label>
<input aria-describedby="email-error" class="w-full px-4 py-3 bg-white/50 border border-outline-variant/30 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-on-surface placeholder:text-on-surface/30" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
<p aria-live="polite" class="hidden text-error text-xs mt-1 ml-1" id="email-error">Please enter a valid email address.</p>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="block text-[10px] font-bold tracking-[0.05em] uppercase text-on-surface/50 ml-1" for="password">
                        PASSWORD
                    </label>
<div class="relative group">
<input aria-describedby="password-error" class="w-full px-4 py-3 bg-white/50 border border-outline-variant/30 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-on-surface placeholder:text-on-surface/30 pr-12" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface/40 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<p aria-live="polite" class="hidden text-error text-xs mt-1 ml-1" id="password-error">Password is required.</p>
</div>
<!-- Actions -->
<div class="space-y-4 pt-2">
<button class="w-full py-3.5 bg-primary hover:bg-secondary text-white font-semibold rounded-xl transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<!-- Loading Spinner (Hidden by default) -->
<div class="hidden animate-spin h-5 w-5 border-2 border-white/30 border-t-white rounded-full"></div>
<span>Sign In</span>
</button>
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-on-surface/5"></div>
<span class="text-[10px] font-bold text-on-surface/30 uppercase tracking-widest">OR</span>
<div class="h-[1px] flex-1 bg-on-surface/5"></div>
</div>
<button class="w-full py-3.5 bg-white hover:bg-surface-container-low border border-outline-variant/30 text-on-surface font-semibold rounded-xl transition-all flex items-center justify-center gap-3 active:scale-[0.98]" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#000000"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#000000"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#000000"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#000000"></path>
</svg>
<span>Continue with Google</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="flex justify-between items-center px-1 pt-2">
<a class="text-xs font-semibold text-primary hover:text-secondary transition-colors" href="#">Create account</a>
<a class="text-xs font-semibold text-primary hover:text-secondary transition-colors" href="#">Forgot password?</a>
</div>
</div>
</main>
<!-- Page Footer -->
<footer class="mt-8 text-on-surface/40">
<p class="text-[12px] font-medium tracking-wide uppercase">© 2024 EntrepreneurOS</p>
</footer>
<!-- Background Decorative Elements -->
<div class="fixed top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px] -z-10"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-tertiary/5 rounded-full blur-[120px] -z-10"></div>
</body></html>
