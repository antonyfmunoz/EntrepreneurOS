<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | EntrepreneurOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#ab8ffe",
                        "inverse-on-surface": "#f0f1f2",
                        "tertiary-container": "#8a4cfc",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "outline": "#7b7486",
                        "on-tertiary-fixed": "#25005a",
                        "primary-fixed-dim": "#d0bcff",
                        "surface": "#f8f9fa",
                        "surface-container-highest": "#e1e3e4",
                        "surface-bright": "#f8f9fa",
                        "background": "#f8f9fa",
                        "on-primary-fixed-variant": "#5516be",
                        "surface-container-high": "#e7e8e9",
                        "surface-container-low": "#f3f4f5",
                        "on-secondary-container": "#3f1e8c",
                        "secondary-fixed": "#e8ddff",
                        "primary-fixed": "#e9ddff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#23005c",
                        "surface-variant": "#e1e3e4",
                        "secondary": "#674bb5",
                        "on-surface-variant": "#494454",
                        "primary": "#6b38d4",
                        "primary-container": "#8455ef",
                        "surface-tint": "#6d3bd7",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#d2bbff",
                        "secondary-fixed-dim": "#cebdff",
                        "inverse-surface": "#2e3132",
                        "on-secondary-fixed-variant": "#4f319c",
                        "tertiary": "#712ae2",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-dim": "#d9dadb",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1d",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#eaddff",
                        "on-background": "#191c1d",
                        "inverse-primary": "#d0bcff",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#fffbff",
                        "on-tertiary-container": "#fffbff",
                        "on-secondary-fixed": "#21005e",
                        "surface-container": "#edeeef",
                        "outline-variant": "#cbc3d7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(203, 195, 215, 0.2);
            box-shadow: 0 8px 32px rgba(26, 26, 46, 0.08);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ghost-border {
            border: 1px solid rgba(203, 195, 215, 0.2);
        }
    </style>
</head>
<body class="bg-[#FFFFFF] font-body text-on-surface min-h-screen flex flex-col items-center justify-center p-6 sm:p-12 antialiased">
<!-- Hero Decorative Element (Subtle Gradient Bleed) -->
<div class="fixed top-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary-fixed opacity-20 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-fixed opacity-20 blur-[100px] rounded-full pointer-events-none"></div>
<main class="w-full max-w-[520px] z-10">
<!-- Header Section -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="smart_toy">smart_toy</span>
<h1 class="text-2xl font-black tracking-tight text-on-surface">EntrepreneurOS</h1>
</div>
<p class="text-on-surface-variant font-medium tracking-wide">Your AI operating system for business</p>
</div>
<!-- Glassmorphic Login Card -->
<div class="glass-card rounded-xl p-8 md:p-10">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant/80 ml-1" for="email">Email</label>
<div class="relative">
<input aria-describedby="email-error" class="w-full h-12 px-4 rounded-lg bg-surface-container-highest/50 border-none focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-on-surface-variant/40 text-on-surface" id="email" name="email" placeholder="you@company.com" type="email"/>
</div>
<p aria-live="polite" class="hidden text-error text-xs font-medium mt-1 flex items-center gap-1" id="email-error">
<span class="material-symbols-outlined text-sm" data-icon="error">error</span>
                        Please enter a valid email address.
                    </p>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant/80" for="password">Password</label>
</div>
<div class="relative group">
<input aria-describedby="password-error" class="w-full h-12 px-4 rounded-lg bg-surface-container-highest/50 border-none focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-on-surface-variant/40 text-on-surface" id="password" name="password" placeholder="Enter your password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<p aria-live="polite" class="hidden text-error text-xs font-medium mt-1 flex items-center gap-1" id="password-error">
<span class="material-symbols-outlined text-sm" data-icon="error">error</span>
                        Password is required.
                    </p>
</div>
<!-- Action Buttons -->
<div class="space-y-4 pt-2">
<button class="w-full h-12 bg-primary hover:bg-primary-container text-white font-semibold rounded-lg shadow-lg shadow-primary/20 transition-all active:scale-[0.98]" type="submit">
                        Sign In
                    </button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 text-xs font-medium text-on-surface-variant/40 uppercase tracking-widest">or</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<button class="w-full h-12 ghost-border bg-white/50 hover:bg-white flex items-center justify-center gap-3 text-on-surface font-semibold rounded-lg transition-all active:scale-[0.98]" type="button">
<svg class="text-on-surface" fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.07-3.71 1.07-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.11c-.22-.67-.35-1.39-.35-2.11s.13-1.44.35-2.11V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.83z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.83c.87-2.6 3.3-4.52 6.16-4.52z" fill="currentColor"></path>
</svg>
                        Continue with Google
                    </button>
</div>
</form>
</div>
<!-- Links Section -->
<nav class="mt-8 flex flex-col items-center gap-4">
<div class="flex items-center gap-6">
<a class="text-sm font-medium text-primary hover:text-tertiary transition-colors" href="#">Create account</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="text-sm font-medium text-primary hover:text-tertiary transition-colors" href="#">Forgot password?</a>
</div>
</nav>
</main>
<!-- Footer Component -->
<footer class="mt-auto py-8 w-full flex flex-col items-center gap-4">
<p class="text-xs font-bold uppercase tracking-widest text-on-surface-variant/60">© EntrepreneurOS</p>
</footer>
</body></html>
